name: Touch Toolkit build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and assemble debug APK
        run: ./gradlew clean test assembleDebug
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: touch-toolkit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
      - name: Publish APK as pre-release
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          FILES=(app/build/outputs/apk/debug/*.apk)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no APK found"; exit 1; }
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" "${FILES[@]}" \
            --target "${{ github.sha }}" --prerelease \
            --title "APK build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}"
