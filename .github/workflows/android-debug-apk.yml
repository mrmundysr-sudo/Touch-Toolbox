name: Build Touch Toolkit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touch-toolkit-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Unpack Touch Toolkit source
        run: unzip -q TouchToolkit-1.4-updated-source.zip -d toolkit

      - name: Build, test, and lint
        working-directory: toolkit
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests dev.touchtoolkit.TouchToolkitTest --tests dev.touchtoolkit.MainActivityTest lintDebug assembleDebug

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: TouchToolkit-debug-${{ github.run_number }}
          path: toolkit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
